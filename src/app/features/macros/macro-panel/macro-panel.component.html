<aside *ngIf="visible" class="macro-panel" aria-label="Panel de macros">
  <header>
    <h3>Macros</h3>
    <button type="button" (click)="close()" aria-label="Cerrar">×</button>
  </header>

  <section *ngIf="draft as currentDraft" class="draft-card">
    <input [(ngModel)]="macroName" aria-label="Nombre de la macro" />
    <div class="macro-role initial"><span></span><strong>{{ currentDraft.params.join(', ') }}</strong></div>
    <div class="macro-role target"><span></span><strong>{{ currentDraft.targets.join(', ') }}</strong></div>
    <button type="button" class="save-button" (click)="saveDraft()">Guardar macro</button>
  </section>

  <ng-container *ngIf="!draft">
    <div *ngIf="activeMacro" class="macro-progress" role="status">
      <strong>{{ activeMacro.name }}</strong>
      <span>{{ requirementsMessage(activeMacro) }}</span>
      <small>{{ selectionMessage(activeMacro.prompt) }}</small>
    </div>

    <section class="macro-list">
      <h4>Biblioteca</h4>
      <div *ngFor="let group of pluginGroups" class="macro-group">
        <button type="button" class="group-button" (click)="toggleGroup(group.name)">
          <span>{{ group.name }}</span><span>{{ expanded.has(group.name) ? '▾' : '▸' }}</span>
        </button>
        <div *ngIf="expanded.has(group.name)" class="group-items">
          <button *ngFor="let item of group.items" type="button" (click)="execute(item)">
            {{ displayName(item) }}
          </button>
        </div>
      </div>
      <p *ngIf="catalog.plugins.length === 0" class="empty">No hay macros de biblioteca.</p>
    </section>

    <section class="macro-list personal-list">
      <h4>Macros personales</h4>
      <button *ngFor="let item of catalog.tools" type="button" class="personal-item" (click)="execute(item)">
        {{ item.name }}
      </button>
      <p *ngIf="catalog.tools.length === 0" class="empty">Todavía no hay macros personales.</p>
    </section>
  </ng-container>
</aside>
